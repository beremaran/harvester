[project]
name = "harvester"
version = "0.1.0"
description = " Dockerized HTTP API that harvests cookies/localStorage/sessionStorage from a target URL via Chromium + playwright-stealth, waiting out anti-bot challenges."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.2",
    "playwright>=1.61.0",
    "playwright-stealth",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.2",
    "uvicorn>=0.51.0",
]

[tool.uv.sources]
playwright-stealth = { git = "https://github.com/beremaran/playwright_stealth", rev = "main" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harvester"]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific rules
    "ASYNC", # flake8-async
    "S",    # flake8-bandit
]
ignore = [
    "S101", # assert is fine, especially in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "ASYNC109"]

[tool.ruff.lint.isort]
known-first-party = ["harvester"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
