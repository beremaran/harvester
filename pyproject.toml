[project]
name = "harvester"
version = "0.1.0"
description = " Dockerized HTTP API that harvests cookies/localStorage/sessionStorage from a target URL via Chromium + playwright-stealth, waiting out anti-bot challenges."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.2",
    "playwright>=1.61.0",
    "playwright-stealth",
    "pydantic>=2.13.4",
    "uvicorn>=0.51.0",
]

[tool.uv.sources]
playwright-stealth = { git = "https://github.com/beremaran/playwright_stealth", rev = "main" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harvester"]
