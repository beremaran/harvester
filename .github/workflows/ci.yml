name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build pinned test image
        run: docker build --target test -t harvester:test .
      - name: Run offline test suite
        run: docker run --rm --shm-size=1g harvester:test pytest -v tests
