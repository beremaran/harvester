name: Bug report
description: Report a reproducible problem with Harvester
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include cookies, credentials, captured secrets, or vulnerability details. Report security issues privately according to SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA, tag, or image identifier
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide a minimal reproduction using a non-sensitive target.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove URLs, cookies, storage values, headers, credentials, and other sensitive data.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include how you ran it (Docker image or `npm run dev`), Node.js and Docker versions, host OS, architecture, and relevant non-secret configuration.
    validations:
      required: true
