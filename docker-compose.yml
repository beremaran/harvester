services:
  harvester:
    build: .
    image: harvester:latest
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      API_KEY: ${API_KEY:-}
      API_KEY_FILE: ${API_KEY_FILE:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
      ALLOW_PRIVATE_NETWORKS: ${ALLOW_PRIVATE_NETWORKS:-false}
      CAPTURE_SECRET_VALUES: ${CAPTURE_SECRET_VALUES:-false}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-2}
      NAVIGATION_TIMEOUT_MS: ${NAVIGATION_TIMEOUT_MS:-45000}
      MAX_HTML_BYTES: ${MAX_HTML_BYTES:-2000000}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-65536}
      BYPASS_HEADERS_JSON: ${BYPASS_HEADERS_JSON:-}
      ALLOW_INSECURE_BYPASS_HEADERS: ${ALLOW_INSECURE_BYPASS_HEADERS:-false}
      ALLOW_CALLER_HEADERS: ${ALLOW_CALLER_HEADERS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Chromium needs a larger shared-memory segment than Docker's 64MB default.
    shm_size: "1gb"
    restart: unless-stopped
    # To use Docker Compose secrets for API_KEY instead of an env var, uncomment:
    # secrets:
    #   - api_key
    # and set: API_KEY_FILE: /run/secrets/api_key

# secrets:
#   api_key:
#     file: ./secrets/api_key.txt
