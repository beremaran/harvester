services:
  renderer-worker:
    build:
      context: .
    # No platform pin: the image builds for amd64 and arm64. Set
    # `platform: linux/amd64` to run Google Chrome on an arm64 host instead of
    # the Chromium the arm64 image carries.
    init: true
    shm_size: 1gb
    ports:
      - "${PORT:-8082}:${PORT:-8082}"
    environment:
      PORT: "${PORT:-8082}"
      RENDER_CONCURRENCY: "${RENDER_CONCURRENCY:-3}"
